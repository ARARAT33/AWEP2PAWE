name: AWEP2PAWE Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Syntax check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.js )
          test "${#files[@]}" -gt 0
          for f in "${files[@]}"; do
            node --check "$f"
          done
          node --check tests/browser-smoke.mjs

      - name: Validate static architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.json
          test -f sw.js
          test -f icon.svg
          test -f state-store.js
          test -f static-connect.js
          grep -q 'runtime.js' index.html
          grep -q 'state-store.js' index.html
          grep -q 'manifest.json' index.html
          grep -q 'serviceWorker' index.html
          ! grep -Eqi 'cloudflare|wrangler|workers?\b|/api/' -- *.html *.js *.json

      - name: Validate PWA and service worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (manifest.display !== 'standalone') throw new Error('manifest display must be standalone');
          if (!manifest.start_url) throw new Error('manifest start_url missing');
          if (!Array.isArray(manifest.icons) || manifest.icons.length < 1) throw new Error('manifest icons missing');
          const sw = fs.readFileSync('sw.js', 'utf8');
          if (!/addEventListener\(['"]install['"]/.test(sw)) throw new Error('service worker install handler missing');
          if (!/addEventListener\(['"]fetch['"]/.test(sw)) throw new Error('service worker fetch handler missing');
          const removed = ['peer-transport.js','app.js','core.js','fixes.js','messenger.js','lite-ui.js','p2p-media.js','pwa.css'];
          for (const file of removed) {
            if (sw.includes(`./${file}`)) throw new Error(`service worker references removed runtime: ${file}`);
          }
          const required = ['state-store.js','runtime.js','voice-messages.js','app-enhancements.js','messenger-actions.js','social-runtime.js','sid-runtime.js','cfid.js','static-connect.js'];
          for (const file of required) {
            if (!sw.includes(`./${file}`)) throw new Error(`service worker missing ${file}`);
          }
          NODE

      - name: Security and completeness gates
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R 'eval(' --include='*.js' .
          ! grep -R 'new Function(' --include='*.js' .
          ! grep -R 'document.write(' --include='*.js' .
          ! grep -R 'TODO\|FIXME' --include='*.js' --include='*.html' --include='*.md' .
          ! grep -R -Ei 'coming soon|not implemented|placeholder' --include='*.js' --include='*.html' .

      - name: Ensure legacy runtimes are absent
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js core.js fixes.js peer-transport.js messenger.js lite-ui.js p2p-media.js pwa.css; do
            test ! -e "$f"
          done

      - name: Install Playwright
        shell: bash
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Run real browser smoke test
        shell: bash
        run: node tests/browser-smoke.mjs

      - name: Verify completion metadata
        shell: bash
        run: grep -q 'Execution: 20 / 20' docs/PRODUCT_COMPLETION.md
