name: AWEP2PAWE Static Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static site quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate pure static architecture
        shell: bash
        run: |
          set -euo pipefail
          required=(index.html styles.css messenger.css light-performance.css state-store.js runtime.js voice-messages.js app-enhancements.js messenger-actions.js social-runtime.js sid-runtime.js cfid.js static-connect.js tests/browser-smoke.mjs docs/PRODUCT_COMPLETION.md)
          for file in "${required[@]}"; do test -f "$file" || { echo "Missing: $file"; exit 1; }; done
          forbidden=(manifest.json sw.js wrangler.toml wrangler.json wrangler.jsonc worker.js workers.js _worker.js)
          for file in "${forbidden[@]}"; do test ! -e "$file" || { echo "Forbidden runtime/PWA file: $file"; exit 1; }; done
          if grep -RniE 'navigator\.serviceWorker|<link[^>]+manifest' --include='*.html' --include='*.js' . --exclude-dir=.git; then
            echo 'PWA runtime reference found.'
            exit 1
          fi

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.js )
          for file in "${files[@]}"; do node --check "$file"; done
          node --check tests/browser-smoke.mjs

      - name: Security and completeness checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'eval\(|new Function\(|document\.write\(' --include='*.js' --exclude-dir=.git .; then
            echo 'Unsafe JavaScript construct found.'
            exit 1
          fi
          if grep -RniE 'TODO|FIXME|coming soon|not implemented|placeholder' --include='*.js' --include='*.html' --include='*.md' --exclude-dir=.git .; then
            echo 'Incomplete implementation marker found.'
            exit 1
          fi

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/browser-smoke.mjs

      - name: Verify static-only completion record
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/PRODUCT_COMPLETION.md
          grep -q 'Pure static site' docs/PRODUCT_COMPLETION.md
