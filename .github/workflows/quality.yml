name: AWEP2PAWE Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every JavaScript runtime
        run: |
          set -eu
          files=$(find . -maxdepth 1 -type f -name '*.js' -print)
          test -n "$files"
          for f in $files; do node --check "$f"; done
      - name: Validate static entrypoint and local-only architecture
        run: |
          set -eu
          test -f index.html
          test -f manifest.json
          test -f sw.js
          test -f icon.svg
          test -f state-store.js
          test -f static-connect.js
          grep -q 'runtime.js' index.html
          grep -q 'state-store.js' index.html
          grep -q 'manifest.json' index.html
          grep -q 'serviceWorker' index.html
          ! grep -Eqi 'cloudflare|wrangler|workers?\b|/api/|fetch\([^)]*(database|storage)' -- *.html *.js *.json
      - name: Validate PWA manifest, service worker and active runtime cache
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if(m.display!=='standalone') throw new Error('manifest display must be standalone');
          if(!m.start_url) throw new Error('manifest start_url missing');
          if(!Array.isArray(m.icons)||m.icons.length<1) throw new Error('manifest icons missing');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!/addEventListener\(['"]install['"]/.test(sw)) throw new Error('service worker install handler missing');
          if(!/addEventListener\(['"]fetch['"]/.test(sw)) throw new Error('service worker fetch handler missing');
          if(/peer-transport\.js|app\.js|core\.js|fixes\.js|messenger\.js|lite-ui\.js|p2p-media\.js|pwa\.css/.test(sw)) throw new Error('service worker references removed runtime');
          for(const file of ['state-store.js','runtime.js','voice-messages.js','app-enhancements.js','messenger-actions.js','social-runtime.js','sid-runtime.js','cfid.js','static-connect.js']){
            if(!sw.includes(`./${file}`)) throw new Error(`service worker missing ${file}`);
          }
          NODE
      - name: Security and completeness gates
        run: |
          set -eu
          ! grep -R "eval(" --include='*.js' .
          ! grep -R "new Function(" --include='*.js' .
          ! grep -R "document.write(" --include='*.js' .
          ! grep -R "TODO\|FIXME" --include='*.js' --include='*.html' --include='*.md' .
          ! grep -R "alert('Success\|toast('Success\|coming soon\|not implemented" --include='*.js' --include='*.html' .
      - name: No legacy competing runtimes
        run: |
          set -eu
          for f in app.js core.js fixes.js peer-transport.js messenger.js lite-ui.js p2p-media.js pwa.css; do
            test ! -e "$f"
          done
      - name: Completion metadata is current
        run: grep -q 'Execution: 20 / 20' docs/PRODUCT_COMPLETION.md
