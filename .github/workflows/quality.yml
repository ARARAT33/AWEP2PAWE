name: AWEP2PAWE Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.js )
          if (( ${#files[@]} == 0 )); then
            echo 'No root JavaScript files found'
          else
            for file in "${files[@]}"; do
              node --check "$file"
            done
          fi
          node --check tests/browser-smoke.mjs

      - name: Validate static application
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.json
          test -f sw.js
          test -f icon.svg
          test -f state-store.js
          test -f static-connect.js
          grep -q 'runtime.js' index.html
          grep -q 'manifest.json' index.html
          grep -q 'serviceWorker' index.html
          if grep -Eqi 'cloudflare|wrangler|/api/' -- *.html *.js *.json; then
            echo 'Forbidden server-side/cloud dependency detected'
            exit 1
          fi

      - name: Validate PWA files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (manifest.display !== 'standalone') throw new Error('manifest display must be standalone');
          if (!manifest.start_url) throw new Error('manifest start_url missing');
          if (!Array.isArray(manifest.icons) || manifest.icons.length === 0) throw new Error('manifest icons missing');
          const sw = fs.readFileSync('sw.js', 'utf8');
          if (!sw.includes("addEventListener('install'")) throw new Error('service worker install handler missing');
          if (!sw.includes("addEventListener('fetch'")) throw new Error('service worker fetch handler missing');
          NODE

      - name: Security and completeness checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n 'eval(' --include='*.js' .; then exit 1; fi
          if grep -R -n 'new Function(' --include='*.js' .; then exit 1; fi
          if grep -R -n 'document.write(' --include='*.js' .; then exit 1; fi
          if grep -R -n -E 'TODO|FIXME|coming soon|not implemented|placeholder' --include='*.js' --include='*.html' --include='*.md' .; then exit 1; fi

      - name: Ensure legacy runtimes are absent
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js core.js fixes.js peer-transport.js messenger.js lite-ui.js p2p-media.js pwa.css; do
            test ! -e "$file"
          done

      - name: Install Playwright
        shell: bash
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        shell: bash
        run: node tests/browser-smoke.mjs

      - name: Verify completion metadata
        shell: bash
        run: grep -q 'Execution: 20 / 20' docs/PRODUCT_COMPLETION.md
